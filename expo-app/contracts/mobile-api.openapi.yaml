openapi: 3.1.0
info:
  title: BTB Mobile API
  version: 0.1.0
  description: >-
    Read-only-first contract between BTB Mobile Next and the dedicated mobile
    BFF. SAP OData names and credentials are intentionally not exposed.
servers:
  - url: https://mobile-api.example.invalid
security:
  - bearerAuth: []
  - pilotKey: []
  - cloudflareAccess: []
paths:
  /v1/btb/rebuild/v1/matches/{key}:
    get:
      operationId: getRebuildMatch
      description: Verified RB1 current selection and frozen recommendation history. No legacy fallback.
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/RebuildVersion"
      responses:
        "200":
          description: Canonical decision evidence; missing or stale evidence has no active current selection.
          headers:
            X-BTB-Rebuild:
              schema: { type: string, const: btb-rebuild.v1 }
          content:
            application/json:
              schema: { $ref: "./btb-rebuild-match.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/btb/rebuild/v1/matches/{key}/statistics:
    get:
      operationId: getRebuildStatistics
      description: Latest verified RB1 observation (at most 120 seconds old) with nullable statistics, per-metric coverage and the backend's current interval pressure. Measured zero is 0; missing is null.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Stale, unsupported or unverifiable sources return empty nullable statistics, never cached values.
          content:
            application/json:
              schema: { $ref: "./btb-match-statistics.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/btb/rebuild/v1/matches/{key}/pressure-history:
    get:
      operationId: getRebuildPressureHistory
      description: Persisted verified RB1 pressure intervals and observations. Not full-match coverage; the expected-score pool path is not exposed.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Historical series only; break the curve where connects is false.
          content:
            application/json:
              schema: { $ref: "./btb-pressure-history.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/btb/rebuild/v1/matches/{key}/pool-path:
    get:
      operationId: getRebuildPoolPath
      description: Verified fixed-half reference survival. Display only; never a winning probability or a substitute for pressure history.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Retained reference counts and explicit connection boundaries; no backfill or full-match coverage claim.
          content:
            application/json:
              schema: { $ref: "./btb-pool-path.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/btb/rebuild/v1/report:
    get:
      operationId: getRebuildReport
      description: Istanbul 7/30-day first-publication cohorts, exact first-quote hypothetical results, match risk and manual review thresholds.
      parameters:
        - $ref: "#/components/parameters/RebuildVersion"
      responses:
        "200":
          description: RB1 only. Pending, unresolved and void records are separate from settled denominators.
          headers:
            X-BTB-Rebuild:
              schema: { type: string, const: btb-rebuild.v1 }
          content:
            application/json:
              schema: { $ref: "./btb-rebuild-report.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/btb/rebuild/v2/report:
    get:
      operationId: getRebuildCohortsReport
      description: Every accepted RB1 policy cohort's first publications of the last 30 Istanbul days in one list, each tagged with its cohort; 7/30-day periods and review thresholds stay per cohort and are never merged.
      parameters:
        - $ref: "#/components/parameters/RebuildVersion"
      responses:
        "200":
          description: RB1 only. A record outside its reported cohorts, a duplicate cohort or two current cohorts fail closed.
          content:
            application/json:
              schema: { $ref: "./btb-rebuild-report-v2.schema.json" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dashboard:
    get:
      operationId: getDashboard
      parameters:
        - $ref: "#/components/parameters/RebuildVersion"
        - $ref: "#/components/parameters/SelectionDisplayVersion"
      responses:
        "200":
          description: Mobile dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches:
    get:
      operationId: getMatches
      parameters:
        - $ref: "#/components/parameters/DecisionContextVersion"
        - $ref: "#/components/parameters/RebuildVersion"
        - $ref: "#/components/parameters/SelectionDisplayVersion"
      responses:
        "200":
          description: Current BTB match state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}:
    get:
      operationId: getMatch
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/DecisionContextVersion"
        - in: header
          name: X-BTB-Journey-Display
          required: false
          description: Version 2 opts into original score ranks for the display. Without it, legacy strict score rows remain unchanged.
          schema: { type: string, enum: ["2"] }
      responses:
        "200":
          description: Current match detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/period-score:
    get:
      operationId: getMatchPeriodScore
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Verified current or historical half-time score context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodScoreContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/league-context:
    get:
      operationId: getMatchLeagueContext
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Current two-team league position and points context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLeagueContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/super-logs:
    get:
      operationId: getMatchSuperLogs
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Bounded historical Super decisions for the exact match.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/SuperLog"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/team-form:
    get:
      operationId: getMatchTeamForm
      description: >-
        Derived, provider-neutral recent form for both sides. Read-only. The
        raw provider payload is terminated server-side and never published.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Summarised team form with sample size and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamFormContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/match-path:
    get:
      operationId: getMatchPath
      description: >-
        Similar-match cohort trajectory carrying separate Event Surprise and
        Current-State Normality signals. A shrinking cohort is not a surprise
        signal. Real computation is TASK-0044 under M9; the v1 payload is
        synthetic and declares that through origin.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Cohort path points with sample size and confidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPathContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/match-journey:
    get:
      operationId: getMatchJourney
      description: >-
        Persistent job observations against a frozen full score pool. First-half
        scores and actual-half-time-conditioned full-time scores drive separate
        phases. Display-only ordinal level; goal elimination uses the compatible
        pre-event denominator. No reconstructed historical samples or Super writes.
        V4 adds the descriptive effect on all tied leading scorelines; it is
        not an event probability. V3 remains the default for existing clients.
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/DecisionContextVersion"
        - name: X-BTB-Match-Journey-Version
          in: header
          required: false
          schema: { type: string, enum: [match-journey.v3, match-journey.v4], default: match-journey.v3 }
      responses:
        "200":
          description: Retained journey; an empty point list means no recorded updates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchJourney"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/live-context:
    get:
      operationId: getMatchLiveContext
      description: >-
        Provider live context (timeline, statistics, freshness) reached through
        the SAP bridge. Read-only; an unconfigured runtime answers 503. Shape:
        `liveContextSchema` in src/api/schemas.ts.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Live context with availability and freshness.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /v1/jinx/quip:
    post:
      operationId: getJinxQuip
      description: >-
        Mascot bubble wording for the given mood. Read scope only; it writes
        nothing and falls back to the deterministic repertoire when no wording
        provider is configured. Shape: `jinxQuipSchema` in src/api/schemas.ts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: One quip.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/analysis-context:
    get:
      operationId: getMatchAnalysisContext
      description: >-
        Captures the match-detail screen's nine read-only sources. The snapshot
        is scoped to the authenticated subject, retained for at most 120 seconds,
        and bounded in memory. acquiredAt is a response acquisition time, not a
        shared provider measurement time. Supplemental reader failures are null.
        This endpoint never invokes Jinx generation.
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/DecisionContextVersion"
        - in: header
          name: X-BTB-Analysis-Features
          schema: { type: string, default: "journey,form" }
          description: Comma-separated journey and form capabilities enabled on the screen; empty disables both.
      responses:
        "200":
          description: Captured screen context; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisContext" }
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/jinx-outlook:
    get:
      operationId: getMatchJinxOutlook
      description: >-
        V1/V2 retain their informative-only behavior for installed clients.
        V3 returns a short policy-backed FAVORABLE/UNFAVORABLE/WAIT assessment
        for an existing displayed selection and server-held analysis snapshot.
        No approved value policy is registered in the current runtime: V3 waits
        with the specific reason and makes no provider call for that wait.
        V4 (owner decision 2026-10-18) is V3 plus the uncalibrated pilot
        `signal` JINX_LEAN_PILOT_V1: the BTB pool share as confidence and a
        FAVORABLE/NEUTRAL/UNFAVORABLE lean against the current price's implied
        share, moved one step by the current or last measured interval
        pressure. The policy verdict keeps the V3 rules.
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/DecisionContextVersion"
        - in: header
          name: X-BTB-Jinx-Version
          required: false
          schema:
            type: string
            enum: [jinx-match-outlook.v1, jinx-match-outlook.v2, jinx-match-outlook.v3, jinx-match-outlook.v4]
        - in: header
          name: X-BTB-Analysis-Snapshot
          schema: { type: string }
          description: Required for V3 and V4; snapshot must belong to the same subject and match. Missing or expired snapshots return 409 ANALYSIS_SNAPSHOT_EXPIRED.
      responses:
        "200":
          description: Informative match outlook with uncertainty and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JinxMatchOutlook"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights:
    get:
      operationId: getMatchInsights
      responses:
        "200":
          description: Optional team-card indicators for current BTB matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights/{key}:
    get:
      operationId: getMatchInsight
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Optional team indicators and real current market rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs:
    get:
      operationId: getSuperLogs
      responses:
        "200":
          description: Historical Super decisions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/SuperLog"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/kpis:
    get:
      operationId: getSuperKpis
      responses:
        "200":
          description: Istanbul-day Super KPI buckets for local device selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperKpis"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs/{key}:
    get:
      operationId: getSuperLog
      parameters:
        - $ref: "#/components/parameters/Key"
        - $ref: "#/components/parameters/DecisionContextVersion"
      responses:
        "200":
          description: Exact historical Super decision snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperLogDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs/{key}/period-score:
    get:
      operationId: getSuperLogPeriodScore
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Half-time score known at the selected Super decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodScoreContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs:
    get:
      operationId: getTotoPrograms
      responses:
        "200":
          description: Toto-native program summaries and predictions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs/{gcNo}/{version}:
    get:
      operationId: getTotoProgram
      parameters:
        - name: gcNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Exact Toto program version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      security:
        - bearerAuth: []
        - pilotKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                platform:
                  type: string
                  enum: [android, ios]
                installationId:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._:-]+$"
      responses:
        "200":
          description: Stable empty acknowledgement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /v1/devices/{installationId}:
    delete:
      operationId: unregisterDevice
      security:
        - bearerAuth: []
        - pilotKey: []
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      responses:
        "204":
          description: Device installation unregistered for the authenticated user.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived generic OIDC user access token for the production profile.
        Issuer, audience, signature, expiry, and local scopes are verified;
        client-credentials tokens are rejected by the BFF.
    pilotKey:
      type: apiKey
      in: header
      name: X-BTB-Pilot-Key
      description: >-
        Rotatable direct-open key accepted only by the explicit pilot profile;
        never a production identity or SAP credential. Refused on the web
        hostname.
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: >-
        Desktop web client (app.surklase.com) only. Set by Cloudflare Access at
        the edge, never by the browser bundle; the BFF verifies issuer (team
        domain), audience tag, RS256 signature, expiry and an allowlisted email.
        Grants read scope only: device routes answer 403.
  parameters:
    SelectionDisplayVersion:
      name: X-BTB-Selection-Display
      in: header
      required: false
      description: With X-BTB-Rebuild, opts dashboard and match lists into recorded current-cycle market quotes and expiry metadata. No historical recommendation becomes active. Responses vary by this header; old clients receive no additional fields.
      schema: { type: string, enum: [btb-selection-display.v1] }
    RebuildVersion:
      name: X-BTB-Rebuild
      in: header
      required: false
      description: Opt into canonical RB1 summaries on dashboard/match routes. Clients require the response acknowledgement and never silently reuse A3.
      schema: { type: string, enum: [btb-rebuild.v1] }
    DecisionContextVersion:
      name: X-BTB-Decision-Context
      in: header
      required: false
      description: >-
        Opt into an acknowledged no-store V2/V3 decision context. V3 adds model
        identity and leading-score pressure direction. The response header echoes
        the requested version; absence retains the legacy body.
      schema: { type: string, enum: [decision-context.v2, decision-context.v3] }
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Bounded API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    DecisionContext:
      $ref: "./decision-context.schema.json"
    ApiError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        correlationId:
          type: string
    MatchStatus:
      type: string
      enum: [LIVE, HALF_TIME, NOT_STARTED, FINISHED]
    MatchSummary:
      type: object
      additionalProperties: false
      required:
        - key
        - id
        - matchDate
        - matchTime
        - league
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
        - elapsed
        - status
        - selectedOdd
        - rating
        - liveRate
        - currentRate
        - pressureDiff
        - totalPressure
        - lastUpdatedAt
      properties:
        rebuild:
          $ref: "./btb-rebuild-summary.schema.json"
        rebuildQuotes:
          oneOf:
            - $ref: "./btb-market-quotes.schema.json"
            - type: "null"
        key: { type: string, minLength: 1 }
        id: { type: integer, minimum: 1 }
        matchDate: { type: string, minLength: 1 }
        matchTime: { type: string, minLength: 1 }
        league: { type: string, minLength: 1 }
        homeTeam: { type: string, minLength: 1 }
        awayTeam: { type: string, minLength: 1 }
        homeParticipantId: { type: [string, "null"], minLength: 1 }
        awayParticipantId: { type: [string, "null"], minLength: 1 }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        elapsed: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/MatchStatus" }
        selectedOdd: { type: string }
        rating: { type: integer, minimum: 0, maximum: 5 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        pressureDiff:
          type: [number, "null"]
        totalPressure:
          type: [number, "null"]
        pressureSource:
          type: [string, "null"]
          enum: [CURRENT_MATCH, null]
        pressureProvider: { type: [string, "null"], minLength: 1 }
        pressureSnapshotAt: { type: [string, "null"], format: date-time }
        lastUpdatedAt: { type: string, format: date-time }
        decisionContext: { $ref: "#/components/schemas/DecisionContext" }
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/MatchSummary"
        - type: object
          required:
            - homeBallPossession
            - awayBallPossession
            - decisionMinute
            - decisionReason
            - decisionScore
            - decisionConfidence
            - homeTotalShots
            - awayTotalShots
            - homeShotsOnTarget
            - awayShotsOnTarget
            - homeXg
            - awayXg
            - homeCorners
            - awayCorners
            - homeYellowCards
            - awayYellowCards
            - homeRedCards
            - awayRedCards
            - scoreDistribution
            - ratioPhase
            - ratioResults
          properties:
            betRadarId:
              description: >-
                BetRadar event id from SAP zbet_t_matches-stats_id. Detail-only
                and null when the live feed did not deliver one.
              type: [string, "null"]
              pattern: "^[1-9][0-9]{0,17}$"
            decisionMinute:
              type: [integer, "null"]
              minimum: 0
            decisionReason: { type: string }
            decisionScore:
              type: [number, "null"]
            decisionConfidence:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            homeBallPossession:
              type: number
              minimum: 0
              maximum: 100
            awayBallPossession:
              type: number
              minimum: 0
              maximum: 100
            homeTotalShots: { type: integer, minimum: 0 }
            awayTotalShots: { type: integer, minimum: 0 }
            homeShotsOnTarget: { type: integer, minimum: 0 }
            awayShotsOnTarget: { type: integer, minimum: 0 }
            homeXg: { type: number, minimum: 0 }
            awayXg: { type: number, minimum: 0 }
            homeCorners: { type: integer, minimum: 0 }
            awayCorners: { type: integer, minimum: 0 }
            homeYellowCards: { type: integer, minimum: 0 }
            awayYellowCards: { type: integer, minimum: 0 }
            homeRedCards: { type: integer, minimum: 0 }
            awayRedCards: { type: integer, minimum: 0 }
            scoreDistribution:
              type: array
              items:
                $ref: "#/components/schemas/ScoreDistribution"
            ratioPhase:
              type: [string, "null"]
              enum: [KICK_OFF, HALF_TIME, LIVE, null]
            ratioResults:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/RatioResult"
      unevaluatedProperties: false
    MatchInsight:
      type: object
      additionalProperties: false
      required:
        - key
        - homeRedCards
        - awayRedCards
        - homeStandingPosition
        - awayStandingPosition
        - marketRates
      properties:
        key: { type: string, minLength: 1 }
        homeRedCards: { type: integer, minimum: 0 }
        awayRedCards: { type: integer, minimum: 0 }
        homeStandingPosition: { type: [integer, "null"], minimum: 1 }
        awayStandingPosition: { type: [integer, "null"], minimum: 1 }
        marketRates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/MatchMarketRate"
    MatchLeagueContext:
      type: object
      additionalProperties: false
      required:
        - key
        - league
        - homeTeam
        - awayTeam
        - source
        - capturedAt
        - homeStandingPosition
        - awayStandingPosition
        - homeStandingPoints
        - awayStandingPoints
      properties:
        key: { type: string, minLength: 1 }
        league: { type: string, minLength: 1 }
        homeTeam: { type: string, minLength: 1 }
        awayTeam: { type: string, minLength: 1 }
        source:
          type: string
          enum: [LATEST_SUPER_DECISION, UNAVAILABLE]
        capturedAt: { type: [string, "null"], format: date-time }
        homeStandingPosition: { type: [integer, "null"], minimum: 1 }
        awayStandingPosition: { type: [integer, "null"], minimum: 1 }
        homeStandingPoints: { type: [integer, "null"], minimum: 0 }
        awayStandingPoints: { type: [integer, "null"], minimum: 0 }
    PeriodScoreContext:
      type: object
      additionalProperties: false
      required: [key, halfTimeScore]
      properties:
        key: { type: string, minLength: 1 }
        halfTimeScore:
          oneOf:
            - type: object
              additionalProperties: false
              required: [homeScore, awayScore]
              properties:
                homeScore: { type: integer, minimum: 0 }
                awayScore: { type: integer, minimum: 0 }
            - type: "null"
    MatchMarketRate:
      type: object
      additionalProperties: false
      required: [sort, betType, liveRate, kickoffRate]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
          exclusiveMinimum: 1
        kickoffRate:
          description: >-
            Pre-kickoff decimal odd from SAP Match Odds (Odd/type 01). Null when
            the source does not publish the requested market.
          type: [number, "null"]
          exclusiveMinimum: 1
    ScoreDistribution:
      type: object
      additionalProperties: false
      required: [score, probability]
      properties:
        score: { type: string, minLength: 1 }
        rank:
          type: integer
          minimum: 1
          description: Original distribution rank, returned only with X-BTB-Journey-Display=2. Hidden rows may leave gaps. Never derive a cohort count from this visible slice.
        probability:
          type: number
          minimum: 0
          maximum: 1
    RatioResult:
      type: object
      additionalProperties: false
      required: [sort, betType, kickOff, halfTime, live]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        kickOff: { type: [number, "null"], minimum: 0, maximum: 100 }
        halfTime: { type: [number, "null"], minimum: 0, maximum: 100 }
        live: { type: [number, "null"], minimum: 0, maximum: 100 }
    SuperLog:
      type: object
      additionalProperties: false
      required:
        - key
        - matchKey
        - matchName
        - createdAt
        - elapsed
        - selectedOdd
        - rating
        - reason
        - liveRate
        - currentRate
        - result
        - profit
        - finalScore
        - pressureAdjustment
        - stateAdjustment
      properties:
        key: { type: string, minLength: 1 }
        matchKey: { type: string, minLength: 1 }
        matchName: { type: string, minLength: 1 }
        homeTeam: { type: [string, "null"], minLength: 1 }
        awayTeam: { type: [string, "null"], minLength: 1 }
        homeParticipantId: { type: [string, "null"], minLength: 1 }
        awayParticipantId: { type: [string, "null"], minLength: 1 }
        createdAt: { type: string, format: date-time }
        elapsed: { type: integer, minimum: 0 }
        selectedOdd: { type: string, minLength: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        result:
          type: string
          enum: [OPEN, WON, LOST, VOID]
        profit:
          type: [number, "null"]
        finalScore: { type: string }
        pressureAdjustment: { type: number }
        stateAdjustment: { type: number }
        decisionContext: { $ref: "#/components/schemas/DecisionContext" }
    SuperLogDetail:
      allOf:
        - $ref: "#/components/schemas/SuperLog"
        - type: object
          required:
            - matchDate
            - matchTime
            - matchId
            - homeTeam
            - awayTeam
            - league
            - marketGroup
            - decisionHomeScore
            - decisionAwayScore
            - baseProbability
            - superProbability
            - modelScore
            - edgeScore
            - compatibilityScore
            - alignmentScore
            - totalPressure
            - pressureDiff
            - homePressure
            - awayPressure
            - deviation
            - initialPool
            - halfTimePool
            - postScorePool
            - selectedOddPool
            - homeStandingPosition
            - awayStandingPosition
            - homeStandingPoints
            - awayStandingPoints
            - standingPpgDiff
            - homeVenuePpg
            - awayVenuePpg
            - venuePpgDiff
            - aiComment
          properties:
            matchDate: { type: string, minLength: 1 }
            matchTime: { type: string }
            matchId: { type: integer, minimum: 1 }
            homeTeam: { type: string, minLength: 1 }
            awayTeam: { type: string, minLength: 1 }
            league: { type: string, minLength: 1 }
            marketGroup: { type: string }
            decisionHomeScore: { type: integer, minimum: 0 }
            decisionAwayScore: { type: integer, minimum: 0 }
            baseProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            superProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            modelScore: { type: [number, "null"] }
            edgeScore: { type: number }
            compatibilityScore: { type: number }
            alignmentScore: { type: number }
            totalPressure: { type: number }
            pressureDiff: { type: number }
            homePressure: { type: number }
            awayPressure: { type: number }
            deviation: { type: number }
            initialPool: { type: integer, minimum: 0 }
            halfTimePool: { type: integer, minimum: 0 }
            postScorePool: { type: integer, minimum: 0 }
            selectedOddPool: { type: integer, minimum: 0 }
            homeStandingPosition: { type: integer, minimum: 0 }
            awayStandingPosition: { type: integer, minimum: 0 }
            homeStandingPoints: { type: integer, minimum: 0 }
            awayStandingPoints: { type: integer, minimum: 0 }
            standingPpgDiff: { type: number }
            homeVenuePpg: { type: number }
            awayVenuePpg: { type: number }
            venuePpgDiff: { type: number }
            aiComment: { type: string }
      unevaluatedProperties: false
    TotoPrediction:
      allOf:
        - $ref: "#/components/schemas/TotoFixture"
        - type: object
          required:
            - mainPick
            - coverage
            - confidence
            - riskScore
            - result
          properties:
            mainPick:
              type: string
              enum: ["1", X, "2"]
            coverage: { type: string, minLength: 1 }
            confidence:
              type: number
              minimum: 0
              maximum: 1
            riskScore: { type: number, minimum: 0 }
            result:
              type: string
              enum: [OPEN, MAIN_HIT, COVERED, MISS]
      unevaluatedProperties: false
    TotoFixture:
      type: object
      additionalProperties: false
      required:
        - matchNo
        - matchName
        - matchDate
        - matchTime
        - eventId
        - actualResult
      properties:
        matchNo: { type: integer, minimum: 1 }
        matchName: { type: string, minLength: 1 }
        matchDate: { type: string }
        matchTime: { type: string }
        eventId:
          type: [integer, "null"]
          minimum: 1
        actualResult:
          type: [string, "null"]
          enum: ["1", X, "2", null]
        homeScore:
          type: [integer, "null"]
          minimum: 0
        awayScore:
          type: [integer, "null"]
          minimum: 0
    TotoProgram:
      type: object
      additionalProperties: false
      required:
        - key
        - gcNo
        - version
        - weekText
        - status
        - modelVersion
        - columns
        - cost
        - maxColumns
        - singleCount
        - doubleCount
        - tripleCount
        - mainHits
        - coverageHits
        - fixtures
        - predictions
        - updatedAt
      properties:
        key: { type: string, minLength: 1 }
        gcNo: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        weekText: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ACTIVE, WAITING_RESULT, RESULTED, ERROR]
        modelVersion: { type: string }
        columns: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0 }
        maxColumns: { type: integer, minimum: 1 }
        singleCount: { type: integer, minimum: 0 }
        doubleCount: { type: integer, minimum: 0 }
        tripleCount: { type: integer, minimum: 0 }
        mainHits:
          type: [integer, "null"]
          minimum: 0
        coverageHits:
          type: [integer, "null"]
          minimum: 0
        theoreticalPrize:
          type: [number, "null"]
          exclusiveMinimum: 0
        theoreticalPrizeCurrency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
          description: >-
            ISO 4217 unit of theoreticalPrize from SAP Programs.currency_code;
            null whenever theoreticalPrize is null. Optional: responses from BFF
            versions before TASK-0109 omit it and served only TRY. Clients must
            accept it before a BFF emits it.
        payoutDescription:
          type: [string, "null"]
          minLength: 1
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/TotoFixture"
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/TotoPrediction"
        updatedAt: { type: string, format: date-time }
    Dashboard:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - liveMatchCount
        - highStarLiveCount
        - liveStarCounts
        - todaySuperWon
        - todaySuperLost
        - todaySuperProfit
        - todayHighStarSuperWon
        - todayHighStarSuperLost
        - todayHighStarSuperProfit
        - latestTotoProgram
        - featuredMatchMode
        - featuredMatches
        - recentSuper
      properties:
        generatedAt: { type: string, format: date-time }
        liveStarSelections:
          type: array
          description: Only with SelectionDisplayVersion. Active live selections at snapshot time; clients expire each entry using validUntil. Historical stars never enter this list.
          items:
            type: object
            additionalProperties: false
            required: [matchKey, stars, validUntil]
            properties:
              matchKey: { type: string }
              stars: { type: integer, minimum: 1, maximum: 5 }
              validUntil: { type: [string, "null"], format: date-time }
        liveMatchCount: { type: integer, minimum: 0 }
        highStarLiveCount: { type: integer, minimum: 0 }
        liveStarCounts:
          $ref: "#/components/schemas/LiveStarCounts"
        todaySuperWon: { type: integer, minimum: 0 }
        todaySuperLost: { type: integer, minimum: 0 }
        todaySuperProfit: { type: number }
        todayHighStarSuperWon: { type: integer, minimum: 0 }
        todayHighStarSuperLost: { type: integer, minimum: 0 }
        todayHighStarSuperProfit: { type: number }
        latestTotoProgram:
          oneOf:
            - $ref: "#/components/schemas/TotoProgram"
            - type: "null"
        featuredMatchMode:
          type: string
          enum: [SELECTED_LIVE, PRESSURE_LIVE, UPCOMING, EMPTY]
        featuredMatches:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/MatchSummary"
        recentSuper:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SuperLog"
    LiveStarCounts:
      type: object
      additionalProperties: false
      required: [ALL, STAR_1, STAR_2, STAR_3, STAR_4, STAR_5, STAR_3_PLUS]
      properties:
        ALL: { type: integer, minimum: 0 }
        STAR_1: { type: integer, minimum: 0 }
        STAR_2: { type: integer, minimum: 0 }
        STAR_3: { type: integer, minimum: 0 }
        STAR_4: { type: integer, minimum: 0 }
        STAR_5: { type: integer, minimum: 0 }
        STAR_3_PLUS: { type: integer, minimum: 0 }
    SuperKpiBucket:
      type: object
      additionalProperties: false
      required: [won, lost, profit]
      properties:
        won: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        profit: { type: number }
    SuperKpis:
      type: object
      additionalProperties: false
      required: [generatedAt, metricDate, buckets]
      properties:
        generatedAt: { type: string, format: date-time }
        metricDate: { type: string, format: date }
        buckets:
          type: object
          additionalProperties: false
          required: [STAR_1_PLUS, STAR_2_PLUS, STAR_3_PLUS, STAR_4_PLUS]
          properties:
            STAR_1_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_2_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_3_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_4_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }

    # ---------------------------------------------------------------- #
    # Mobile Intelligence Foundation (M15)
    #
    # origin says whether the payload carries measured values or synthetic
    # ones. A client that cannot parse it must treat the payload as SYNTHETIC:
    # an unknown origin may never claim to be evidence.
    # ---------------------------------------------------------------- #
    IntelligenceOrigin:
      type: string
      enum: [LIVE, SYNTHETIC]
    IntelligenceAvailability:
      type: string
      description: >-
        LOW_SAMPLE means the values are real but rest on too little evidence to
        be characteristic. It is neither OK nor UNAVAILABLE.
      enum: [OK, LOW_SAMPLE, UNAVAILABLE]
    TeamFormSide:
      type: object
      additionalProperties: false
      required:
        - side
        - wins
        - draws
        - losses
        - matchesSampled
        - formPpg
        - venuePpg
        - goalsForPerMatch
        - goalsAgainstPerMatch
        - bttsPercent
        - over25Percent
        - restDays
      properties:
        side: { type: string, enum: [HOME, AWAY] }
        wins: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        matchesSampled: { type: integer, minimum: 0 }
        recentResults:
          type: [array, "null"]
          maxItems: 5
          items: { type: string, enum: [W, D, L] }
          description: Newest first. Absent or null means chronology is unavailable; never infer it from aggregate counts.
        formPpg: { type: [number, "null"], minimum: 0, maximum: 3 }
        venuePpg: { type: [number, "null"], minimum: 0, maximum: 3 }
        goalsForPerMatch: { type: [number, "null"], minimum: 0 }
        goalsAgainstPerMatch: { type: [number, "null"], minimum: 0 }
        bttsPercent: { type: [number, "null"], minimum: 0, maximum: 100 }
        over25Percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        restDays: { type: [integer, "null"], minimum: 0 }
    TeamFormContext:
      type: object
      required:
        - contractVersion
        - origin
        - availability
        - minimumReliableSample
        - home
        - away
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, const: team-form.v1 }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { $ref: "#/components/schemas/IntelligenceAvailability" }
        minimumReliableSample: { type: integer, minimum: 1 }
        home:
          oneOf:
            - $ref: "#/components/schemas/TeamFormSide"
            - type: "null"
        away:
          oneOf:
            - $ref: "#/components/schemas/TeamFormSide"
            - type: "null"
        capturedAt: { type: [string, "null"], format: date-time }
    MatchJourneyPoint:
      type: object
      required: [key, capturedAt, minute, plotMinute, elapsed, phase, status, home, away, kind, reason, level, connects, referenceChange, poolKey, compatibleCount, beforeCount, eliminatedCount, eliminatedRatio, pressureAlignment]
      properties:
        decisionContext: { $ref: "#/components/schemas/DecisionContext" }
        key: { type: string, minLength: 1 }
        capturedAt: { type: [string, "null"], format: date-time }
        minute: { type: [integer, "null"], minimum: 0, maximum: 150 }
        plotMinute: { type: [number, "null"], minimum: 0, maximum: 150 }
        elapsed: { type: string }
        phase: { type: [integer, "null"], enum: [1, 2, null] }
        status: { type: string }
        home: { type: [integer, "null"], minimum: 0 }
        away: { type: [integer, "null"], minimum: 0 }
        kind: { type: string, enum: [STATE, GAP, KICK_OFF, GOAL, HALF_TIME, FULL_TIME, CORRECTION, POOL_CHANGE] }
        reason: { type: string }
        level: { type: [number, "null"], minimum: 0, maximum: 1, description: Uncalibrated ordinal display index. }
        connects: { type: boolean }
        referenceChange: { type: boolean }
        poolKey: { type: [string, "null"] }
        compatibleCount: { type: [integer, "null"], minimum: 0 }
        beforeCount: { type: [integer, "null"], minimum: 0 }
        eliminatedCount: { type: [integer, "null"], minimum: 0 }
        eliminatedRatio: { type: [number, "null"], minimum: 0, maximum: 1 }
        pressureAlignment: { type: [number, "null"], minimum: -1, maximum: 1 }
    MatchJourneyPool:
      type: object
      required: [key, phase, capturedAt, halfTimeScore, count, modes, rows]
      properties:
        key: { type: string }
        phase: { type: integer, enum: [1, 2] }
        capturedAt: { type: string, format: date-time }
        halfTimeScore: { type: [string, "null"] }
        count: { type: integer, minimum: 1 }
        modes: { type: array, minItems: 1, items: { type: string } }
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [score, count]
            properties:
              score: { type: string }
              count: { type: integer, minimum: 1 }
    MatchJourney:
      oneOf:
        - $ref: "#/components/schemas/MatchJourneyV3"
        - $ref: "#/components/schemas/MatchJourneyV4"
    MatchJourneyV3:
      allOf:
        - $ref: "#/components/schemas/MatchJourneyBase"
        - type: object
          properties:
            contractVersion: { const: match-journey.v3 }
            points:
              type: array
              items: { not: { required: [eventEffect] } }
    MatchJourneyV4:
      allOf:
        - $ref: "#/components/schemas/MatchJourneyBase"
        - type: object
          properties:
            contractVersion: { const: match-journey.v4 }
            points:
              type: array
              items:
                type: object
                required: [eventEffect]
                properties:
                  eventEffect:
                    oneOf:
                      - $ref: "#/components/schemas/GoalModeEffect"
                      - type: "null"
    GoalModeEffect:
      type: object
      description: >-
        Descriptive arithmetic on one frozen score-transition boundary, not
        event probability or causal card attribution. MEASURED requires nonempty
        tied mode sets, ordered captures and consistent positive denominators;
        UNMEASURED carries a reason and null arithmetic. Runtime validation
        also binds identities, counts and share to the retained point.
      required: [measurementStatus, missingReason, beforeSampleKey, afterSampleKey,
        observedFrom, observedTo, poolKey, phase, beforeScore, afterScore, preModes,
        postModes, beforeCount, afterCount, blockedModeCount, preModeCount,
        blockedModeShare, eventSurprise, scale]
      properties:
        measurementStatus: { type: string, enum: [MEASURED, UNMEASURED] }
        missingReason:
          type: [string, "null"]
          enum: [CAPTURE_ORDER_UNPROVEN, REFERENCE_CHANGED, NON_GOAL_BOUNDARY, INVALID_POOL,
            EMPTY_PRE_EVENT_POOL, EMPTY_POST_EVENT_POOL, CONFLICTING_SAMPLE, REPEATED_SCORE_TRANSITION, null]
        beforeSampleKey: { type: string, minLength: 1 }
        afterSampleKey: { type: string, minLength: 1 }
        observedFrom: { type: [string, "null"], format: date-time }
        observedTo: { type: [string, "null"], format: date-time }
        poolKey: { type: [string, "null"] }
        phase: { type: [integer, "null"], enum: [1, 2, null] }
        beforeScore: { type: string, pattern: '^\d+-\d+$' }
        afterScore: { type: string, pattern: '^\d+-\d+$' }
        preModes: { type: array, maxItems: 5000, items: { type: string, pattern: '^\d+-\d+$' } }
        postModes: { type: array, maxItems: 5000, items: { type: string, pattern: '^\d+-\d+$' } }
        beforeCount: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
        afterCount: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
        blockedModeCount: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
        preModeCount: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
        blockedModeShare: { type: [number, "null"], minimum: 0, maximum: 1 }
        eventSurprise: { type: "null" }
        scale: { type: string, const: MODAL_DISRUPTION_UNCALIBRATED }
    MatchJourneyBase:
      type: object
      required: [matchKey, contractVersion, origin, availability, capturedAt, missingReason, scale, points, pools]
      properties:
        matchKey: { type: string }
        contractVersion: { type: string, enum: [match-journey.v3, match-journey.v4] }
        origin: { type: string, enum: [LIVE, SYNTHETIC] }
        availability: { type: string, enum: [OK, UNAVAILABLE] }
        capturedAt: { type: [string, "null"], format: date-time }
        missingReason: { type: [string, "null"] }
        scale: { type: string, const: ORDINAL_UNCALIBRATED }
        points: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/MatchJourneyPoint" } }
        pools: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/MatchJourneyPool" } }
    MatchPathPoint:
      type: object
      required:
        - pointKey
        - label
        - kind
        - minute
        - cohortSize
        - eventSurprise
        - stateNormality
        - confidence
      properties:
        pointKey: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [KICK_OFF, GOAL, RED_CARD, HALF_TIME, STATE, FULL_TIME, UNKNOWN]
        minute: { type: [integer, "null"] }
        cohortSize: { type: integer, minimum: 0 }
        eventSurprise:
          description: >-
            How unusual the event itself was. Never derived from cohortSize;
            null where it was not computed.
          type: [number, "null"]
          minimum: 0
          maximum: 1
        stateNormality:
          description: How ordinary the resulting match state is.
          type: [number, "null"]
          minimum: 0
          maximum: 1
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
    MatchPathContext:
      type: object
      required:
        - contractVersion
        - origin
        - availability
        - minimumReliableCohort
        - initialCohortSize
        - points
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, const: match-path.v1 }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { $ref: "#/components/schemas/IntelligenceAvailability" }
        minimumReliableCohort: { type: integer, minimum: 1 }
        initialCohortSize: { type: integer, minimum: 0 }
        points:
          description: >-
            null means not retrieved. An empty array means retrieved, and the
            match has no path yet. The two are never conflated.
          type: [array, "null"]
          maxItems: 40
          items: { $ref: "#/components/schemas/MatchPathPoint" }
        capturedAt: { type: [string, "null"], format: date-time }
    JinxOutlookSignal:
      type: object
      required: [signalKey, label, direction, strength]
      properties:
        signalKey: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        direction: { type: string, enum: [SUPPORTING, OPPOSING, NEUTRAL] }
        strength: { type: string, enum: [WEAK, MODERATE, STRONG] }
    JinxMatchOutlook:
      oneOf:
        - $ref: "#/components/schemas/JinxMatchOutlookV1"
        - $ref: "#/components/schemas/JinxMatchOutlookV2"
        - $ref: "#/components/schemas/JinxMatchOutlookV3"
        - $ref: "#/components/schemas/JinxMatchOutlookV4"
    AnalysisContext:
      type: object
      required: [contractVersion, matchKey, snapshotId, evidenceRevision, selectionKey, acquiredAt, expiresAt, sources, sourceAvailability, valueEvidence]
      properties:
        contractVersion: { const: btb-analysis-context.v1 }
        matchKey: { type: string }
        snapshotId: { type: string }
        evidenceRevision: { type: string }
        selectionKey: { type: string }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sourceAvailability: { type: object, additionalProperties: { type: string } }
        valueEvidence:
          type: [object, "null"]
          description: >-
            Null until an approved BTB-owned adapter is registered. Evidence
            must carry policyId/modelVersion/validationRef, sampleStatus,
            probability, odds, marketStatus, selectionKey, stateKey,
            quoteStateKey, quoteMeasuredAt and probabilityMeasuredAt.
            Legacy BASE_PROB, stars and pool shares never substitute for it.
        sources:
          type: object
          required: [matchDetail, insight, periodScore, leagueContext, superLogs, liveContext, teamForm, matchPath, matchJourney]
          properties:
            matchDetail:
              allOf:
                - $ref: "#/components/schemas/MatchDetail"
                - type: object
                  required: [currentMatchRecord]
                  properties:
                    currentMatchRecord: { type: boolean }
            insight:
              anyOf: [{ $ref: "#/components/schemas/MatchInsight" }, { type: "null" }]
            periodScore:
              anyOf: [{ $ref: "#/components/schemas/PeriodScoreContext" }, { type: "null" }]
            leagueContext:
              anyOf: [{ $ref: "#/components/schemas/MatchLeagueContext" }, { type: "null" }]
            superLogs:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/SuperLog" }
            liveContext:
              type: [object, "null"]
              description: Existing provider-neutral LiveContext DTO.
            teamForm:
              anyOf: [{ $ref: "#/components/schemas/TeamFormContext" }, { type: "null" }]
            matchPath:
              anyOf: [{ $ref: "#/components/schemas/MatchPathContext" }, { type: "null" }]
            matchJourney:
              anyOf: [{ $ref: "#/components/schemas/MatchJourney" }, { type: "null" }]
    JinxMatchOutlookV3:
      type: object
      additionalProperties: false
      required: [contractVersion, matchKey, snapshotId, evidenceRevision, selectionKey, evaluatedAt, expiresAt, verdict, reasonCode, shortReason, riskNote, evidence, sourceAvailability, explanationOrigin, value]
      properties:
        contractVersion: { const: jinx-match-outlook.v3 }
        matchKey: { type: string }
        snapshotId: { type: string }
        evidenceRevision: { type: string }
        selectionKey: { type: string }
        evaluatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        verdict: { type: string, enum: [FAVORABLE, UNFAVORABLE, WAIT] }
        reasonCode:
          type: string
          enum: [MATCH_NOT_LIVE, LIVE_NOT_VERIFIED, NO_SELECTION, CONTEXT_CONFLICT, POLICY_UNAVAILABLE, VALUE_UNAVAILABLE, MARKET_UNAVAILABLE, STATE_MISMATCH, EVIDENCE_STALE, VALUE_POSITIVE, VALUE_NEGATIVE]
        shortReason: { type: string, minLength: 1, maxLength: 240 }
        riskNote: { type: [string, "null"], maxLength: 120 }
        explanationOrigin: { type: string, enum: [LIVE, DETERMINISTIC] }
        sourceAvailability: { type: object, additionalProperties: { type: string } }
        evidence:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [id, source, text]
            properties:
              id: { type: string }
              source: { type: string }
              text: { type: string, maxLength: 2500 }
        value:
          type: [object, "null"]
          description: Null for WAIT. Otherwise approved probability/odds, fairPrice, expectedValue, minimumExpectedValue, policyId, modelVersion, validationRef and both measurement timestamps; verdict must match the value criterion.
    JinxMatchOutlookV4:
      type: object
      additionalProperties: false
      description: V3 fields and verdict rules, a 320-character shortReason, no missing-value riskNote, and the pilot signal.
      required: [contractVersion, matchKey, snapshotId, evidenceRevision, selectionKey, evaluatedAt, expiresAt, verdict, reasonCode, shortReason, riskNote, evidence, sourceAvailability, explanationOrigin, value, signal]
      properties:
        contractVersion: { const: jinx-match-outlook.v4 }
        matchKey: { type: string }
        snapshotId: { type: string }
        evidenceRevision: { type: string }
        selectionKey: { type: string }
        evaluatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        verdict: { $ref: "#/components/schemas/JinxMatchOutlookV3/properties/verdict" }
        reasonCode: { $ref: "#/components/schemas/JinxMatchOutlookV3/properties/reasonCode" }
        shortReason: { type: string, minLength: 1, maxLength: 320 }
        riskNote: { type: [string, "null"], maxLength: 120 }
        explanationOrigin: { type: string, enum: [LIVE, DETERMINISTIC] }
        sourceAvailability: { type: object, additionalProperties: { type: string } }
        evidence: { $ref: "#/components/schemas/JinxMatchOutlookV3/properties/evidence" }
        value: { $ref: "#/components/schemas/JinxMatchOutlookV3/properties/value" }
        signal:
          type: [object, "null"]
          additionalProperties: false
          required: [policyId, basis, confidence, odds, impliedProbability, edge, lean, pressure]
          description: Null for stale, conflicting, not-live, settled or confidence-less snapshots. impliedProbability = 1/odds and edge = confidence - impliedProbability; odds, impliedProbability, edge and lean are null together when no current price exists.
          properties:
            policyId: { const: JINX_LEAN_PILOT_V1 }
            basis: { const: POOL_SHARE_UNCALIBRATED }
            confidence: { type: number, exclusiveMinimum: 0, maximum: 1 }
            odds: { type: [number, "null"], exclusiveMinimum: 1 }
            impliedProbability: { type: [number, "null"], exclusiveMinimum: 0, exclusiveMaximum: 1 }
            edge: { type: [number, "null"], exclusiveMinimum: -1, exclusiveMaximum: 1 }
            lean: { type: [string, "null"], enum: [FAVORABLE, NEUTRAL, UNFAVORABLE, null] }
            pressure:
              type: [object, "null"]
              additionalProperties: false
              required: [homeShare, leader, effect, source, minute]
              properties:
                homeShare: { type: [number, "null"], minimum: 0, maximum: 1 }
                leader: { type: string, enum: [HOME, AWAY, BALANCED, NONE] }
                effect: { type: string, enum: [FOR, AGAINST, NEUTRAL] }
                source: { type: string, enum: [CURRENT, LAST_INTERVAL], description: "CURRENT: fresh current interval (<= 240 s); LAST_INTERVAL: latest measured journey interval (<= 10 min)" }
                minute: { type: [integer, "null"], minimum: 0, maximum: 150, description: Match minute of a LAST_INTERVAL sample; null for CURRENT }
    JinxMatchOutlookV2:
      allOf:
        - $ref: "#/components/schemas/JinxMatchOutlookBase"
        - type: object
          required: [sections]
          properties:
            contractVersion: { const: jinx-match-outlook.v2 }
            body: { type: "null" }
            sections:
              type: array
              maxItems: 3
              description: Empty when unavailable; otherwise SUPPORTING, LIMITING, WATCH in that order.
              items:
                type: object
                additionalProperties: false
                required: [kind, body]
                properties:
                  kind: { type: string, enum: [SUPPORTING, LIMITING, WATCH] }
                  body: { type: string, minLength: 1, maxLength: 2500 }
    JinxMatchOutlookV1:
      allOf:
        - $ref: "#/components/schemas/JinxMatchOutlookBase"
        - type: object
          properties:
            contractVersion: { const: jinx-match-outlook.v1 }
    JinxMatchOutlookBase:
      type: object
      description: >-
        Informative only. Must carry no recommendation, no certainty about the
        future, and no model, Super or rating vocabulary; the client refuses
        such wording again before rendering.
      required:
        - contractVersion
        - origin
        - availability
        - headline
        - body
        - confidence
        - uncertaintyNote
        - signals
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, enum: [jinx-match-outlook.v1, jinx-match-outlook.v2] }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { type: string, enum: [OK, DEGRADED, UNAVAILABLE] }
        headline: { type: [string, "null"] }
        body: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        uncertaintyNote: { type: [string, "null"] }
        signals:
          type: [array, "null"]
          maxItems: 8
          items: { $ref: "#/components/schemas/JinxOutlookSignal" }
        freshness:
          type: object
          properties:
            capturedAt: { type: [string, "null"], format: date-time }
            ageSeconds: { type: [number, "null"] }
            stale: { type: boolean }
