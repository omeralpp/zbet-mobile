openapi: 3.1.0
info:
  title: BTB Mobile API
  version: 0.1.0
  description: >-
    Read-only-first contract between BTB Mobile Next and the dedicated mobile
    BFF. SAP OData names and credentials are intentionally not exposed.
servers:
  - url: https://mobile-api.example.invalid
security:
  - pilotKey: []
paths:
  /v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Mobile dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches:
    get:
      operationId: getMatches
      responses:
        "200":
          description: Current BTB match state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}:
    get:
      operationId: getMatch
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Current match detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights:
    get:
      operationId: getMatchInsights
      responses:
        "200":
          description: Optional team-card indicators for current BTB matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights/{key}:
    get:
      operationId: getMatchInsight
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Optional team indicators and real current market rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs:
    get:
      operationId: getSuperLogs
      responses:
        "200":
          description: Historical Super decisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuperLog"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/kpis:
    get:
      operationId: getSuperKpis
      responses:
        "200":
          description: Istanbul-day Super KPI buckets for local device selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperKpis"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs/{key}:
    get:
      operationId: getSuperLog
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Exact historical Super decision snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperLogDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs:
    get:
      operationId: getTotoPrograms
      responses:
        "200":
          description: Toto-native program summaries and predictions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs/{gcNo}/{version}:
    get:
      operationId: getTotoProgram
      parameters:
        - name: gcNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Exact Toto program version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      security:
        - pilotKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                platform:
                  type: string
                  enum: [android, ios]
      responses:
        "200":
          description: Stable empty acknowledgement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    pilotKey:
      type: apiKey
      in: header
      name: X-BTB-Pilot-Key
      description: Rotatable direct-open pilot key; not a SAP credential.
  parameters:
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Bounded API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        correlationId:
          type: string
    MatchStatus:
      type: string
      enum: [LIVE, HALF_TIME, NOT_STARTED, FINISHED]
    MatchSummary:
      type: object
      additionalProperties: false
      required:
        - key
        - id
        - matchDate
        - matchTime
        - league
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
        - elapsed
        - status
        - selectedOdd
        - rating
        - liveRate
        - currentRate
        - pressureDiff
        - totalPressure
        - lastUpdatedAt
      properties:
        key: { type: string, minLength: 1 }
        id: { type: integer, minimum: 1 }
        matchDate: { type: string, minLength: 1 }
        matchTime: { type: string, minLength: 1 }
        league: { type: string, minLength: 1 }
        homeTeam: { type: string, minLength: 1 }
        awayTeam: { type: string, minLength: 1 }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        elapsed: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/MatchStatus" }
        selectedOdd: { type: string }
        rating: { type: integer, minimum: 0, maximum: 5 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        pressureDiff: { type: number }
        totalPressure: { type: number }
        lastUpdatedAt: { type: string, format: date-time }
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/MatchSummary"
        - type: object
          required:
            - homeBallPossession
            - awayBallPossession
            - decisionMinute
            - decisionReason
            - decisionScore
            - decisionConfidence
            - homeTotalShots
            - awayTotalShots
            - homeShotsOnTarget
            - awayShotsOnTarget
            - homeXg
            - awayXg
            - homeCorners
            - awayCorners
            - homeYellowCards
            - awayYellowCards
            - homeRedCards
            - awayRedCards
            - scoreDistribution
            - ratioPhase
            - ratioResults
          properties:
            decisionMinute:
              type: [integer, "null"]
              minimum: 0
            decisionReason: { type: string }
            decisionScore:
              type: [number, "null"]
            decisionConfidence:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            homeBallPossession:
              type: number
              minimum: 0
              maximum: 100
            awayBallPossession:
              type: number
              minimum: 0
              maximum: 100
            homeTotalShots: { type: integer, minimum: 0 }
            awayTotalShots: { type: integer, minimum: 0 }
            homeShotsOnTarget: { type: integer, minimum: 0 }
            awayShotsOnTarget: { type: integer, minimum: 0 }
            homeXg: { type: number, minimum: 0 }
            awayXg: { type: number, minimum: 0 }
            homeCorners: { type: integer, minimum: 0 }
            awayCorners: { type: integer, minimum: 0 }
            homeYellowCards: { type: integer, minimum: 0 }
            awayYellowCards: { type: integer, minimum: 0 }
            homeRedCards: { type: integer, minimum: 0 }
            awayRedCards: { type: integer, minimum: 0 }
            scoreDistribution:
              type: array
              items:
                $ref: "#/components/schemas/ScoreDistribution"
            ratioPhase:
              type: [string, "null"]
              enum: [KICK_OFF, HALF_TIME, LIVE, null]
            ratioResults:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/RatioResult"
      unevaluatedProperties: false
    MatchInsight:
      type: object
      additionalProperties: false
      required:
        - key
        - homeRedCards
        - awayRedCards
        - homeStandingPosition
        - awayStandingPosition
        - marketRates
      properties:
        key: { type: string, minLength: 1 }
        homeRedCards: { type: integer, minimum: 0 }
        awayRedCards: { type: integer, minimum: 0 }
        homeStandingPosition: { type: [integer, "null"], minimum: 1 }
        awayStandingPosition: { type: [integer, "null"], minimum: 1 }
        marketRates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/MatchMarketRate"
    MatchMarketRate:
      type: object
      additionalProperties: false
      required: [sort, betType, liveRate]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
          exclusiveMinimum: 1
    ScoreDistribution:
      type: object
      additionalProperties: false
      required: [score, probability]
      properties:
        score: { type: string, minLength: 1 }
        probability:
          type: number
          minimum: 0
          maximum: 1
    RatioResult:
      type: object
      additionalProperties: false
      required: [sort, betType, kickOff, halfTime, live]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        kickOff: { type: [number, "null"], minimum: 0, maximum: 100 }
        halfTime: { type: [number, "null"], minimum: 0, maximum: 100 }
        live: { type: [number, "null"], minimum: 0, maximum: 100 }
    SuperLog:
      type: object
      additionalProperties: false
      required:
        - key
        - matchKey
        - matchName
        - createdAt
        - elapsed
        - selectedOdd
        - rating
        - reason
        - liveRate
        - currentRate
        - result
        - profit
        - finalScore
        - pressureAdjustment
        - stateAdjustment
      properties:
        key: { type: string, minLength: 1 }
        matchKey: { type: string, minLength: 1 }
        matchName: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        elapsed: { type: integer, minimum: 0 }
        selectedOdd: { type: string, minLength: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        result:
          type: string
          enum: [OPEN, WON, LOST, VOID]
        profit:
          type: [number, "null"]
        finalScore: { type: string }
        pressureAdjustment: { type: number }
        stateAdjustment: { type: number }
    SuperLogDetail:
      allOf:
        - $ref: "#/components/schemas/SuperLog"
        - type: object
          required:
            - matchDate
            - matchTime
            - matchId
            - homeTeam
            - awayTeam
            - league
            - marketGroup
            - decisionHomeScore
            - decisionAwayScore
            - baseProbability
            - superProbability
            - modelScore
            - edgeScore
            - compatibilityScore
            - alignmentScore
            - totalPressure
            - pressureDiff
            - homePressure
            - awayPressure
            - deviation
            - initialPool
            - halfTimePool
            - postScorePool
            - selectedOddPool
            - homeStandingPosition
            - awayStandingPosition
            - homeStandingPoints
            - awayStandingPoints
            - standingPpgDiff
            - homeVenuePpg
            - awayVenuePpg
            - venuePpgDiff
            - aiComment
          properties:
            matchDate: { type: string, minLength: 1 }
            matchTime: { type: string }
            matchId: { type: integer, minimum: 1 }
            homeTeam: { type: string, minLength: 1 }
            awayTeam: { type: string, minLength: 1 }
            league: { type: string, minLength: 1 }
            marketGroup: { type: string }
            decisionHomeScore: { type: integer, minimum: 0 }
            decisionAwayScore: { type: integer, minimum: 0 }
            baseProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            superProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            modelScore: { type: [number, "null"] }
            edgeScore: { type: number }
            compatibilityScore: { type: number }
            alignmentScore: { type: number }
            totalPressure: { type: number }
            pressureDiff: { type: number }
            homePressure: { type: number }
            awayPressure: { type: number }
            deviation: { type: number }
            initialPool: { type: integer, minimum: 0 }
            halfTimePool: { type: integer, minimum: 0 }
            postScorePool: { type: integer, minimum: 0 }
            selectedOddPool: { type: integer, minimum: 0 }
            homeStandingPosition: { type: integer, minimum: 0 }
            awayStandingPosition: { type: integer, minimum: 0 }
            homeStandingPoints: { type: integer, minimum: 0 }
            awayStandingPoints: { type: integer, minimum: 0 }
            standingPpgDiff: { type: number }
            homeVenuePpg: { type: number }
            awayVenuePpg: { type: number }
            venuePpgDiff: { type: number }
            aiComment: { type: string }
      unevaluatedProperties: false
    TotoPrediction:
      allOf:
        - $ref: "#/components/schemas/TotoFixture"
        - type: object
          required:
            - mainPick
            - coverage
            - confidence
            - riskScore
            - result
          properties:
            mainPick:
              type: string
              enum: ["1", X, "2"]
            coverage: { type: string, minLength: 1 }
            confidence:
              type: number
              minimum: 0
              maximum: 1
            riskScore: { type: number, minimum: 0 }
            result:
              type: string
              enum: [OPEN, MAIN_HIT, COVERED, MISS]
      unevaluatedProperties: false
    TotoFixture:
      type: object
      additionalProperties: false
      required:
        - matchNo
        - matchName
        - matchDate
        - matchTime
        - eventId
        - actualResult
      properties:
        matchNo: { type: integer, minimum: 1 }
        matchName: { type: string, minLength: 1 }
        matchDate: { type: string }
        matchTime: { type: string }
        eventId:
          type: [integer, "null"]
          minimum: 1
        actualResult:
          type: [string, "null"]
          enum: ["1", X, "2", null]
    TotoProgram:
      type: object
      additionalProperties: false
      required:
        - key
        - gcNo
        - version
        - weekText
        - status
        - modelVersion
        - columns
        - cost
        - maxColumns
        - singleCount
        - doubleCount
        - tripleCount
        - mainHits
        - coverageHits
        - fixtures
        - predictions
        - updatedAt
      properties:
        key: { type: string, minLength: 1 }
        gcNo: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        weekText: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ACTIVE, WAITING_RESULT, RESULTED, ERROR]
        modelVersion: { type: string }
        columns: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0 }
        maxColumns: { type: integer, minimum: 1 }
        singleCount: { type: integer, minimum: 0 }
        doubleCount: { type: integer, minimum: 0 }
        tripleCount: { type: integer, minimum: 0 }
        mainHits:
          type: [integer, "null"]
          minimum: 0
        coverageHits:
          type: [integer, "null"]
          minimum: 0
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/TotoFixture"
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/TotoPrediction"
        updatedAt: { type: string, format: date-time }
    Dashboard:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - liveMatchCount
        - highStarLiveCount
        - liveStarCounts
        - todaySuperWon
        - todaySuperLost
        - todaySuperProfit
        - todayHighStarSuperWon
        - todayHighStarSuperLost
        - todayHighStarSuperProfit
        - latestTotoProgram
        - featuredMatchMode
        - featuredMatches
        - recentSuper
      properties:
        generatedAt: { type: string, format: date-time }
        liveMatchCount: { type: integer, minimum: 0 }
        highStarLiveCount: { type: integer, minimum: 0 }
        liveStarCounts:
          $ref: "#/components/schemas/LiveStarCounts"
        todaySuperWon: { type: integer, minimum: 0 }
        todaySuperLost: { type: integer, minimum: 0 }
        todaySuperProfit: { type: number }
        todayHighStarSuperWon: { type: integer, minimum: 0 }
        todayHighStarSuperLost: { type: integer, minimum: 0 }
        todayHighStarSuperProfit: { type: number }
        latestTotoProgram:
          oneOf:
            - $ref: "#/components/schemas/TotoProgram"
            - type: "null"
        featuredMatchMode:
          type: string
          enum: [SELECTED_LIVE, PRESSURE_LIVE, UPCOMING, EMPTY]
        featuredMatches:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/MatchSummary"
        recentSuper:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SuperLog"
    LiveStarCounts:
      type: object
      additionalProperties: false
      required: [ALL, STAR_1, STAR_2, STAR_3, STAR_4, STAR_5, STAR_3_PLUS]
      properties:
        ALL: { type: integer, minimum: 0 }
        STAR_1: { type: integer, minimum: 0 }
        STAR_2: { type: integer, minimum: 0 }
        STAR_3: { type: integer, minimum: 0 }
        STAR_4: { type: integer, minimum: 0 }
        STAR_5: { type: integer, minimum: 0 }
        STAR_3_PLUS: { type: integer, minimum: 0 }
    SuperKpiBucket:
      type: object
      additionalProperties: false
      required: [won, lost, profit]
      properties:
        won: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        profit: { type: number }
    SuperKpis:
      type: object
      additionalProperties: false
      required: [generatedAt, metricDate, buckets]
      properties:
        generatedAt: { type: string, format: date-time }
        metricDate: { type: string, format: date }
        buckets:
          type: object
          additionalProperties: false
          required: [STAR_1_PLUS, STAR_2_PLUS, STAR_3_PLUS, STAR_4_PLUS]
          properties:
            STAR_1_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_2_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_3_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_4_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
