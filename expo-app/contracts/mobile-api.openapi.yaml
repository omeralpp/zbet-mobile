openapi: 3.1.0
info:
  title: BTB Mobile API
  version: 0.1.0
  description: >-
    Read-only-first contract between BTB Mobile Next and the dedicated mobile
    BFF. SAP OData names and credentials are intentionally not exposed.
servers:
  - url: https://mobile-api.example.invalid
security:
  - bearerAuth: []
  - pilotKey: []
paths:
  /v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Mobile dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches:
    get:
      operationId: getMatches
      responses:
        "200":
          description: Current BTB match state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSummary"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}:
    get:
      operationId: getMatch
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Current match detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/period-score:
    get:
      operationId: getMatchPeriodScore
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Verified current or historical half-time score context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodScoreContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/league-context:
    get:
      operationId: getMatchLeagueContext
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Current two-team league position and points context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLeagueContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/super-logs:
    get:
      operationId: getMatchSuperLogs
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Bounded historical Super decisions for the exact match.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/SuperLog"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/team-form:
    get:
      operationId: getMatchTeamForm
      description: >-
        Derived, provider-neutral recent form for both sides. Read-only. The
        raw provider payload is terminated server-side and never published.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Summarised team form with sample size and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamFormContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/match-path:
    get:
      operationId: getMatchPath
      description: >-
        Similar-match cohort trajectory carrying separate Event Surprise and
        Current-State Normality signals. A shrinking cohort is not a surprise
        signal. Real computation is TASK-0044 under M9; the v1 payload is
        synthetic and declares that through origin.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Cohort path points with sample size and confidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPathContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/matches/{key}/jinx-outlook:
    get:
      operationId: getMatchJinxOutlook
      description: >-
        Informative-only Jinx reading of one match. Carries no recommendation,
        no forecast and no model, Super or rating decision. Real centralized
        analysis is TASK-0011 under M11.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Informative match outlook with uncertainty and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JinxMatchOutlook"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights:
    get:
      operationId: getMatchInsights
      responses:
        "200":
          description: Optional team-card indicators for current BTB matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/btb/match-insights/{key}:
    get:
      operationId: getMatchInsight
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Optional team indicators and real current market rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchInsight"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs:
    get:
      operationId: getSuperLogs
      responses:
        "200":
          description: Historical Super decisions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/SuperLog"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/kpis:
    get:
      operationId: getSuperKpis
      responses:
        "200":
          description: Istanbul-day Super KPI buckets for local device selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperKpis"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs/{key}:
    get:
      operationId: getSuperLog
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Exact historical Super decision snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperLogDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/super/logs/{key}/period-score:
    get:
      operationId: getSuperLogPeriodScore
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: Half-time score known at the selected Super decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodScoreContext"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs:
    get:
      operationId: getTotoPrograms
      responses:
        "200":
          description: Toto-native program summaries and predictions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/toto/programs/{gcNo}/{version}:
    get:
      operationId: getTotoProgram
      parameters:
        - name: gcNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Exact Toto program version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotoProgram"
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      security:
        - bearerAuth: []
        - pilotKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                platform:
                  type: string
                  enum: [android, ios]
                installationId:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._:-]+$"
      responses:
        "200":
          description: Stable empty acknowledgement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /v1/devices/{installationId}:
    delete:
      operationId: unregisterDevice
      security:
        - bearerAuth: []
        - pilotKey: []
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      responses:
        "204":
          description: Device installation unregistered for the authenticated user.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived generic OIDC user access token for the production profile.
        Issuer, audience, signature, expiry, and local scopes are verified;
        client-credentials tokens are rejected by the BFF.
    pilotKey:
      type: apiKey
      in: header
      name: X-BTB-Pilot-Key
      description: >-
        Rotatable direct-open key accepted only by the explicit pilot profile;
        never a production identity or SAP credential.
  parameters:
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Bounded API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        correlationId:
          type: string
    MatchStatus:
      type: string
      enum: [LIVE, HALF_TIME, NOT_STARTED, FINISHED]
    MatchSummary:
      type: object
      additionalProperties: false
      required:
        - key
        - id
        - matchDate
        - matchTime
        - league
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
        - elapsed
        - status
        - selectedOdd
        - rating
        - liveRate
        - currentRate
        - pressureDiff
        - totalPressure
        - lastUpdatedAt
      properties:
        key: { type: string, minLength: 1 }
        id: { type: integer, minimum: 1 }
        matchDate: { type: string, minLength: 1 }
        matchTime: { type: string, minLength: 1 }
        league: { type: string, minLength: 1 }
        homeTeam: { type: string, minLength: 1 }
        awayTeam: { type: string, minLength: 1 }
        homeParticipantId: { type: [string, "null"], minLength: 1 }
        awayParticipantId: { type: [string, "null"], minLength: 1 }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        elapsed: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/MatchStatus" }
        selectedOdd: { type: string }
        rating: { type: integer, minimum: 0, maximum: 5 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        pressureDiff:
          type: [number, "null"]
        totalPressure:
          type: [number, "null"]
        pressureSource:
          type: [string, "null"]
          enum: [CURRENT_MATCH, null]
        pressureProvider: { type: [string, "null"], minLength: 1 }
        pressureSnapshotAt: { type: [string, "null"], format: date-time }
        lastUpdatedAt: { type: string, format: date-time }
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/MatchSummary"
        - type: object
          required:
            - homeBallPossession
            - awayBallPossession
            - decisionMinute
            - decisionReason
            - decisionScore
            - decisionConfidence
            - homeTotalShots
            - awayTotalShots
            - homeShotsOnTarget
            - awayShotsOnTarget
            - homeXg
            - awayXg
            - homeCorners
            - awayCorners
            - homeYellowCards
            - awayYellowCards
            - homeRedCards
            - awayRedCards
            - scoreDistribution
            - ratioPhase
            - ratioResults
          properties:
            betRadarId:
              description: >-
                BetRadar event id from SAP zbet_t_matches-stats_id. Detail-only
                and null when the live feed did not deliver one.
              type: [string, "null"]
              pattern: "^[1-9][0-9]{0,17}$"
            decisionMinute:
              type: [integer, "null"]
              minimum: 0
            decisionReason: { type: string }
            decisionScore:
              type: [number, "null"]
            decisionConfidence:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            homeBallPossession:
              type: number
              minimum: 0
              maximum: 100
            awayBallPossession:
              type: number
              minimum: 0
              maximum: 100
            homeTotalShots: { type: integer, minimum: 0 }
            awayTotalShots: { type: integer, minimum: 0 }
            homeShotsOnTarget: { type: integer, minimum: 0 }
            awayShotsOnTarget: { type: integer, minimum: 0 }
            homeXg: { type: number, minimum: 0 }
            awayXg: { type: number, minimum: 0 }
            homeCorners: { type: integer, minimum: 0 }
            awayCorners: { type: integer, minimum: 0 }
            homeYellowCards: { type: integer, minimum: 0 }
            awayYellowCards: { type: integer, minimum: 0 }
            homeRedCards: { type: integer, minimum: 0 }
            awayRedCards: { type: integer, minimum: 0 }
            scoreDistribution:
              type: array
              items:
                $ref: "#/components/schemas/ScoreDistribution"
            ratioPhase:
              type: [string, "null"]
              enum: [KICK_OFF, HALF_TIME, LIVE, null]
            ratioResults:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/RatioResult"
      unevaluatedProperties: false
    MatchInsight:
      type: object
      additionalProperties: false
      required:
        - key
        - homeRedCards
        - awayRedCards
        - homeStandingPosition
        - awayStandingPosition
        - marketRates
      properties:
        key: { type: string, minLength: 1 }
        homeRedCards: { type: integer, minimum: 0 }
        awayRedCards: { type: integer, minimum: 0 }
        homeStandingPosition: { type: [integer, "null"], minimum: 1 }
        awayStandingPosition: { type: [integer, "null"], minimum: 1 }
        marketRates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/MatchMarketRate"
    MatchLeagueContext:
      type: object
      additionalProperties: false
      required:
        - key
        - league
        - homeTeam
        - awayTeam
        - source
        - capturedAt
        - homeStandingPosition
        - awayStandingPosition
        - homeStandingPoints
        - awayStandingPoints
      properties:
        key: { type: string, minLength: 1 }
        league: { type: string, minLength: 1 }
        homeTeam: { type: string, minLength: 1 }
        awayTeam: { type: string, minLength: 1 }
        source:
          type: string
          enum: [LATEST_SUPER_DECISION, UNAVAILABLE]
        capturedAt: { type: [string, "null"], format: date-time }
        homeStandingPosition: { type: [integer, "null"], minimum: 1 }
        awayStandingPosition: { type: [integer, "null"], minimum: 1 }
        homeStandingPoints: { type: [integer, "null"], minimum: 0 }
        awayStandingPoints: { type: [integer, "null"], minimum: 0 }
    PeriodScoreContext:
      type: object
      additionalProperties: false
      required: [key, halfTimeScore]
      properties:
        key: { type: string, minLength: 1 }
        halfTimeScore:
          oneOf:
            - type: object
              additionalProperties: false
              required: [homeScore, awayScore]
              properties:
                homeScore: { type: integer, minimum: 0 }
                awayScore: { type: integer, minimum: 0 }
            - type: "null"
    MatchMarketRate:
      type: object
      additionalProperties: false
      required: [sort, betType, liveRate, kickoffRate]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
          exclusiveMinimum: 1
        kickoffRate:
          description: >-
            Pre-kickoff decimal odd from SAP Match Odds (Odd/type 01). Null when
            the source does not publish the requested market.
          type: [number, "null"]
          exclusiveMinimum: 1
    ScoreDistribution:
      type: object
      additionalProperties: false
      required: [score, probability]
      properties:
        score: { type: string, minLength: 1 }
        probability:
          type: number
          minimum: 0
          maximum: 1
    RatioResult:
      type: object
      additionalProperties: false
      required: [sort, betType, kickOff, halfTime, live]
      properties:
        sort: { type: integer, minimum: 0 }
        betType: { type: string, minLength: 1 }
        kickOff: { type: [number, "null"], minimum: 0, maximum: 100 }
        halfTime: { type: [number, "null"], minimum: 0, maximum: 100 }
        live: { type: [number, "null"], minimum: 0, maximum: 100 }
    SuperLog:
      type: object
      additionalProperties: false
      required:
        - key
        - matchKey
        - matchName
        - createdAt
        - elapsed
        - selectedOdd
        - rating
        - reason
        - liveRate
        - currentRate
        - result
        - profit
        - finalScore
        - pressureAdjustment
        - stateAdjustment
      properties:
        key: { type: string, minLength: 1 }
        matchKey: { type: string, minLength: 1 }
        matchName: { type: string, minLength: 1 }
        homeTeam: { type: [string, "null"], minLength: 1 }
        awayTeam: { type: [string, "null"], minLength: 1 }
        homeParticipantId: { type: [string, "null"], minLength: 1 }
        awayParticipantId: { type: [string, "null"], minLength: 1 }
        createdAt: { type: string, format: date-time }
        elapsed: { type: integer, minimum: 0 }
        selectedOdd: { type: string, minLength: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string, minLength: 1 }
        liveRate:
          type: [number, "null"]
        currentRate:
          type: [number, "null"]
        result:
          type: string
          enum: [OPEN, WON, LOST, VOID]
        profit:
          type: [number, "null"]
        finalScore: { type: string }
        pressureAdjustment: { type: number }
        stateAdjustment: { type: number }
    SuperLogDetail:
      allOf:
        - $ref: "#/components/schemas/SuperLog"
        - type: object
          required:
            - matchDate
            - matchTime
            - matchId
            - homeTeam
            - awayTeam
            - league
            - marketGroup
            - decisionHomeScore
            - decisionAwayScore
            - baseProbability
            - superProbability
            - modelScore
            - edgeScore
            - compatibilityScore
            - alignmentScore
            - totalPressure
            - pressureDiff
            - homePressure
            - awayPressure
            - deviation
            - initialPool
            - halfTimePool
            - postScorePool
            - selectedOddPool
            - homeStandingPosition
            - awayStandingPosition
            - homeStandingPoints
            - awayStandingPoints
            - standingPpgDiff
            - homeVenuePpg
            - awayVenuePpg
            - venuePpgDiff
            - aiComment
          properties:
            matchDate: { type: string, minLength: 1 }
            matchTime: { type: string }
            matchId: { type: integer, minimum: 1 }
            homeTeam: { type: string, minLength: 1 }
            awayTeam: { type: string, minLength: 1 }
            league: { type: string, minLength: 1 }
            marketGroup: { type: string }
            decisionHomeScore: { type: integer, minimum: 0 }
            decisionAwayScore: { type: integer, minimum: 0 }
            baseProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            superProbability: { type: [number, "null"], minimum: 0, maximum: 1 }
            modelScore: { type: [number, "null"] }
            edgeScore: { type: number }
            compatibilityScore: { type: number }
            alignmentScore: { type: number }
            totalPressure: { type: number }
            pressureDiff: { type: number }
            homePressure: { type: number }
            awayPressure: { type: number }
            deviation: { type: number }
            initialPool: { type: integer, minimum: 0 }
            halfTimePool: { type: integer, minimum: 0 }
            postScorePool: { type: integer, minimum: 0 }
            selectedOddPool: { type: integer, minimum: 0 }
            homeStandingPosition: { type: integer, minimum: 0 }
            awayStandingPosition: { type: integer, minimum: 0 }
            homeStandingPoints: { type: integer, minimum: 0 }
            awayStandingPoints: { type: integer, minimum: 0 }
            standingPpgDiff: { type: number }
            homeVenuePpg: { type: number }
            awayVenuePpg: { type: number }
            venuePpgDiff: { type: number }
            aiComment: { type: string }
      unevaluatedProperties: false
    TotoPrediction:
      allOf:
        - $ref: "#/components/schemas/TotoFixture"
        - type: object
          required:
            - mainPick
            - coverage
            - confidence
            - riskScore
            - result
          properties:
            mainPick:
              type: string
              enum: ["1", X, "2"]
            coverage: { type: string, minLength: 1 }
            confidence:
              type: number
              minimum: 0
              maximum: 1
            riskScore: { type: number, minimum: 0 }
            result:
              type: string
              enum: [OPEN, MAIN_HIT, COVERED, MISS]
      unevaluatedProperties: false
    TotoFixture:
      type: object
      additionalProperties: false
      required:
        - matchNo
        - matchName
        - matchDate
        - matchTime
        - eventId
        - actualResult
      properties:
        matchNo: { type: integer, minimum: 1 }
        matchName: { type: string, minLength: 1 }
        matchDate: { type: string }
        matchTime: { type: string }
        eventId:
          type: [integer, "null"]
          minimum: 1
        actualResult:
          type: [string, "null"]
          enum: ["1", X, "2", null]
        homeScore:
          type: [integer, "null"]
          minimum: 0
        awayScore:
          type: [integer, "null"]
          minimum: 0
    TotoProgram:
      type: object
      additionalProperties: false
      required:
        - key
        - gcNo
        - version
        - weekText
        - status
        - modelVersion
        - columns
        - cost
        - maxColumns
        - singleCount
        - doubleCount
        - tripleCount
        - mainHits
        - coverageHits
        - fixtures
        - predictions
        - updatedAt
      properties:
        key: { type: string, minLength: 1 }
        gcNo: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        weekText: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ACTIVE, WAITING_RESULT, RESULTED, ERROR]
        modelVersion: { type: string }
        columns: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0 }
        maxColumns: { type: integer, minimum: 1 }
        singleCount: { type: integer, minimum: 0 }
        doubleCount: { type: integer, minimum: 0 }
        tripleCount: { type: integer, minimum: 0 }
        mainHits:
          type: [integer, "null"]
          minimum: 0
        coverageHits:
          type: [integer, "null"]
          minimum: 0
        theoreticalPrize:
          type: [number, "null"]
          exclusiveMinimum: 0
        payoutDescription:
          type: [string, "null"]
          minLength: 1
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/TotoFixture"
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/TotoPrediction"
        updatedAt: { type: string, format: date-time }
    Dashboard:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - liveMatchCount
        - highStarLiveCount
        - liveStarCounts
        - todaySuperWon
        - todaySuperLost
        - todaySuperProfit
        - todayHighStarSuperWon
        - todayHighStarSuperLost
        - todayHighStarSuperProfit
        - latestTotoProgram
        - featuredMatchMode
        - featuredMatches
        - recentSuper
      properties:
        generatedAt: { type: string, format: date-time }
        liveMatchCount: { type: integer, minimum: 0 }
        highStarLiveCount: { type: integer, minimum: 0 }
        liveStarCounts:
          $ref: "#/components/schemas/LiveStarCounts"
        todaySuperWon: { type: integer, minimum: 0 }
        todaySuperLost: { type: integer, minimum: 0 }
        todaySuperProfit: { type: number }
        todayHighStarSuperWon: { type: integer, minimum: 0 }
        todayHighStarSuperLost: { type: integer, minimum: 0 }
        todayHighStarSuperProfit: { type: number }
        latestTotoProgram:
          oneOf:
            - $ref: "#/components/schemas/TotoProgram"
            - type: "null"
        featuredMatchMode:
          type: string
          enum: [SELECTED_LIVE, PRESSURE_LIVE, UPCOMING, EMPTY]
        featuredMatches:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/MatchSummary"
        recentSuper:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SuperLog"
    LiveStarCounts:
      type: object
      additionalProperties: false
      required: [ALL, STAR_1, STAR_2, STAR_3, STAR_4, STAR_5, STAR_3_PLUS]
      properties:
        ALL: { type: integer, minimum: 0 }
        STAR_1: { type: integer, minimum: 0 }
        STAR_2: { type: integer, minimum: 0 }
        STAR_3: { type: integer, minimum: 0 }
        STAR_4: { type: integer, minimum: 0 }
        STAR_5: { type: integer, minimum: 0 }
        STAR_3_PLUS: { type: integer, minimum: 0 }
    SuperKpiBucket:
      type: object
      additionalProperties: false
      required: [won, lost, profit]
      properties:
        won: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        profit: { type: number }
    SuperKpis:
      type: object
      additionalProperties: false
      required: [generatedAt, metricDate, buckets]
      properties:
        generatedAt: { type: string, format: date-time }
        metricDate: { type: string, format: date }
        buckets:
          type: object
          additionalProperties: false
          required: [STAR_1_PLUS, STAR_2_PLUS, STAR_3_PLUS, STAR_4_PLUS]
          properties:
            STAR_1_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_2_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_3_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }
            STAR_4_PLUS: { $ref: "#/components/schemas/SuperKpiBucket" }

    # ---------------------------------------------------------------- #
    # Mobile Intelligence Foundation (M15)
    #
    # origin says whether the payload carries measured values or synthetic
    # ones. A client that cannot parse it must treat the payload as SYNTHETIC:
    # an unknown origin may never claim to be evidence.
    # ---------------------------------------------------------------- #
    IntelligenceOrigin:
      type: string
      enum: [LIVE, SYNTHETIC]
    IntelligenceAvailability:
      type: string
      description: >-
        LOW_SAMPLE means the values are real but rest on too little evidence to
        be characteristic. It is neither OK nor UNAVAILABLE.
      enum: [OK, LOW_SAMPLE, UNAVAILABLE]
    TeamFormSide:
      type: object
      additionalProperties: false
      required:
        - side
        - wins
        - draws
        - losses
        - matchesSampled
        - formPpg
        - venuePpg
        - goalsForPerMatch
        - goalsAgainstPerMatch
        - bttsPercent
        - over25Percent
        - restDays
      properties:
        side: { type: string, enum: [HOME, AWAY] }
        wins: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        matchesSampled: { type: integer, minimum: 0 }
        formPpg: { type: [number, "null"], minimum: 0, maximum: 3 }
        venuePpg: { type: [number, "null"], minimum: 0, maximum: 3 }
        goalsForPerMatch: { type: [number, "null"], minimum: 0 }
        goalsAgainstPerMatch: { type: [number, "null"], minimum: 0 }
        bttsPercent: { type: [number, "null"], minimum: 0, maximum: 100 }
        over25Percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        restDays: { type: [integer, "null"], minimum: 0 }
    TeamFormContext:
      type: object
      required:
        - contractVersion
        - origin
        - availability
        - minimumReliableSample
        - home
        - away
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, const: team-form.v1 }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { $ref: "#/components/schemas/IntelligenceAvailability" }
        minimumReliableSample: { type: integer, minimum: 1 }
        home:
          oneOf:
            - $ref: "#/components/schemas/TeamFormSide"
            - type: "null"
        away:
          oneOf:
            - $ref: "#/components/schemas/TeamFormSide"
            - type: "null"
        capturedAt: { type: [string, "null"], format: date-time }
    MatchPathPoint:
      type: object
      required:
        - pointKey
        - label
        - kind
        - minute
        - cohortSize
        - eventSurprise
        - stateNormality
        - confidence
      properties:
        pointKey: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [KICK_OFF, GOAL, RED_CARD, HALF_TIME, STATE, FULL_TIME, UNKNOWN]
        minute: { type: [integer, "null"] }
        cohortSize: { type: integer, minimum: 0 }
        eventSurprise:
          description: >-
            How unusual the event itself was. Never derived from cohortSize;
            null where it was not computed.
          type: [number, "null"]
          minimum: 0
          maximum: 1
        stateNormality:
          description: How ordinary the resulting match state is.
          type: [number, "null"]
          minimum: 0
          maximum: 1
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
    MatchPathContext:
      type: object
      required:
        - contractVersion
        - origin
        - availability
        - minimumReliableCohort
        - initialCohortSize
        - points
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, const: match-path.v1 }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { $ref: "#/components/schemas/IntelligenceAvailability" }
        minimumReliableCohort: { type: integer, minimum: 1 }
        initialCohortSize: { type: integer, minimum: 0 }
        points:
          description: >-
            null means not retrieved. An empty array means retrieved, and the
            match has no path yet. The two are never conflated.
          type: [array, "null"]
          maxItems: 40
          items: { $ref: "#/components/schemas/MatchPathPoint" }
        capturedAt: { type: [string, "null"], format: date-time }
    JinxOutlookSignal:
      type: object
      required: [signalKey, label, direction, strength]
      properties:
        signalKey: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        direction: { type: string, enum: [SUPPORTING, OPPOSING, NEUTRAL] }
        strength: { type: string, enum: [WEAK, MODERATE, STRONG] }
    JinxMatchOutlook:
      type: object
      description: >-
        Informative only. Must carry no recommendation, no certainty about the
        future, and no model, Super or rating vocabulary; the client refuses
        such wording again before rendering.
      required:
        - contractVersion
        - origin
        - availability
        - headline
        - body
        - confidence
        - uncertaintyNote
        - signals
      properties:
        matchKey: { type: [string, "null"] }
        contractVersion: { type: string, const: jinx-match-outlook.v1 }
        origin: { $ref: "#/components/schemas/IntelligenceOrigin" }
        availability: { type: string, enum: [OK, DEGRADED, UNAVAILABLE] }
        headline: { type: [string, "null"] }
        body: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        uncertaintyNote: { type: [string, "null"] }
        signals:
          type: [array, "null"]
          maxItems: 8
          items: { $ref: "#/components/schemas/JinxOutlookSignal" }
        freshness:
          type: object
          properties:
            capturedAt: { type: [string, "null"], format: date-time }
            ageSeconds: { type: [number, "null"] }
            stale: { type: boolean }
